<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>이번주 한줄평</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>이번주 한줄평</h1>
    <div class="header-actions">
      <button id="btn-history" class="icon-btn" title="지난 기록">🗒</button>
      <button id="btn-refresh" class="icon-btn" title="새로고침">↻</button>
      <button id="btn-settings" class="icon-btn" title="설정">⚙</button>
    </div>
  </header>

  <main>
    <!-- 로그인 화면 -->
    <section id="login-view" hidden>
      <div class="hero">
        <div class="hero-icon">♪</div>
        <p>한 주 동안 새로 좋아요한 곡에<br />별점과 한 줄 감상을 남겨보세요.</p>
        <button id="btn-login" class="primary">Spotify로 로그인</button>
        <p id="login-msg" class="sub-msg"></p>
      </div>
    </section>

    <!-- 메인: 이번 주 곡 목록 -->
    <section id="main-view" hidden>
      <div id="config-banner" class="banner" hidden>
        저장 서버가 아직 연결되지 않았어요.
        <button id="btn-open-settings" class="link-btn">설정하기</button>
      </div>
      <p id="summary" class="summary"></p>
      <div id="song-list"></div>
      <div id="empty-state" class="empty" hidden></div>
      <button id="btn-save-all" class="primary sticky-save" hidden>작성한 기록 모두 저장</button>
    </section>

    <!-- 지난 기록 -->
    <section id="history-view" hidden>
      <p class="summary">최근 남긴 별점과 한줄평</p>
      <div id="history-list"></div>
      <button id="btn-back" class="ghost">← 이번 주 목록으로</button>
    </section>

    <!-- 로딩 -->
    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p id="loading-msg">불러오는 중…</p>
    </div>
  </main>

  <!-- 설정 -->
  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>설정</h2>
      <label>저장 서버 주소 (Apps Script URL)
        <input type="url" id="set-url" placeholder="https://script.google.com/macros/s/…/exec" />
      </label>
      <label>비밀 토큰
        <input type="password" id="set-secret" placeholder="SETUP.md에서 정한 값" />
      </label>
      <label>몇 일치 좋아요를 볼까요?
        <input type="number" id="set-days" min="1" max="30" />
      </label>
      <div class="dialog-actions">
        <button type="button" id="btn-test" class="ghost">연결 테스트</button>
        <button type="submit" id="btn-save-settings" class="primary">저장</button>
      </div>
      <p id="test-result" class="sub-msg"></p>
      <button type="button" id="btn-logout" class="link-btn danger">Spotify 연결 해제</button>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="review-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
